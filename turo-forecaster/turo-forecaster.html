<title>Turo Car Forecaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* Layout: header + car chips, then inputs (left, scrolls on its own) beside live results (right); one column on phones. */
:root {
  --bg: #F4F5F2; --card: #FFFFFF; --ink: #1C2220; --sub: #5E6A65; --muted: #8C9792; --line: #DFE3DE;
  --accent: #0E6B5F; --accent-ink: #FFFFFF; --accent-soft: #E2EFEB;
  --good: #1D7A4E; --good-soft: #E3F2EA; --bad: #B0392C; --bad-soft: #F8E6E3; --warn: #8A5A00; --warn-soft: #FBF0D9;
  --s1: #2a78d6; --s2: #eb6834; --grid: #E8EBE7;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --card: #191F1D; --ink: #E6EBE8; --sub: #A0ACA7; --muted: #75817C; --line: #2A3330;
  --accent: #52B8A6; --accent-ink: #0D1513; --accent-soft: #1C2E2A;
  --good: #52C68E; --good-soft: #17291F; --bad: #F07C6C; --bad-soft: #2E1B18; --warn: #E8B44C; --warn-soft: #2C2412;
  --s1: #3987e5; --s2: #d95926; --grid: #232B28; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111513; --card: #191F1D; --ink: #E6EBE8; --sub: #A0ACA7; --muted: #75817C; --line: #2A3330;
  --accent: #52B8A6; --accent-ink: #0D1513; --accent-soft: #1C2E2A;
  --good: #52C68E; --good-soft: #17291F; --bad: #F07C6C; --bad-soft: #2E1B18; --warn: #E8B44C; --warn-soft: #2C2412;
  --s1: #3987e5; --s2: #d95926; --grid: #232B28; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
button, input, select { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* header */
.top { border-bottom: 1px solid var(--line); background: var(--bg); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.badge { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand h1 { font: 700 26px/1 var(--f-display); letter-spacing: .3px; margin: 0; text-transform: uppercase; }
.brand .status { color: var(--sub); font-size: 12px; margin-top: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--sub); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* car chips */
.cars { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--sub); white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* main grid */
.main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; padding-block: 12px 32px; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.inputs { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; }
@media (max-width: 900px) { .inputs { position: static; max-height: none; } }
.carname { padding: 14px 14px 4px; }
.carname input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: transparent; font-weight: 600; font-size: 15px; }
details.sec { border-top: 1px solid var(--line); }
details.sec:first-of-type { border-top: 0; }
details.sec summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--sub); }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary .chev { transition: transform .15s; }
details.sec[open] summary .chev { transform: rotate(90deg); }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; padding: 0 14px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld label { font-size: 12px; color: var(--sub); }
.box { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.box:focus-within { border-color: var(--accent); }
.box span { color: var(--muted); font-size: 12px; padding-inline: 8px 0; }
.box span.suf { padding-inline: 0 8px; }
.box input, .box select { width: 100%; min-width: 0; border: 0; background: transparent; padding: 7px 8px; outline: none; font-family: var(--f-num); font-size: 13px; }
.hint { font-size: 11px; color: var(--muted); line-height: 1.35; }
.season { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0 14px 14px; }
.season .box input { padding: 6px 4px; text-align: center; }
.season label { font-size: 11px; color: var(--muted); text-align: center; display: block; }

/* results */
.results { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.kpis { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpi { padding: 14px; min-width: 0; }
.kpi .lbl { font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--sub); font-weight: 600; }
.kpi .val { font: 700 34px/1.05 var(--f-display); margin-top: 6px; letter-spacing: .2px; }
.kpi .sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
.kpi.hero { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.kpi.hero .lbl, .kpi.hero .sub { color: var(--accent-ink); opacity: .85; }
.kpi.hero .val { font-size: 42px; }
.good { color: var(--good); } .bad { color: var(--bad); }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--sub); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap; font-size: 13px; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card { padding: 16px; min-width: 0; }
.card h2 { font: 600 20px/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .4px; margin: 0 0 4px; }
.card .cap { color: var(--sub); font-size: 12.5px; margin: 0 0 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .row2 { grid-template-columns: minmax(0, 1fr); } }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.chartbox { position: relative; }
.chartbox svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 12px; }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 76px; align-items: center; gap: 8px; font-size: 12.5px; }
.bar .track { height: 10px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 0 4px 4px 0; }
.bar .v { text-align: right; }
.bar .n { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.list { display: flex; flex-direction: column; }
.li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li.total { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 0; margin-top: 2px; }
.li .k { color: var(--sub); }
.li.total .k { color: var(--ink); }

.flags { display: flex; flex-direction: column; gap: 8px; }
.flag { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
.flag.warn { background: var(--warn-soft); color: var(--warn); }
.flag.bad { background: var(--bad-soft); color: var(--bad); }
.flag.ok { background: var(--good-soft); color: var(--good); }
.flag .t { color: var(--ink); }

.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--sub); font-weight: 600; position: sticky; top: 0; background: var(--card); }
th:first-child, td:first-child { text-align: left; }
tr.mark td { background: var(--accent-soft); }
td.pos { color: var(--good); } td.neg { color: var(--bad); }
.grid td.cell { text-align: center; font-family: var(--f-num); }
.grid td.cell.pos { background: var(--good-soft); }
.grid td.cell.neg { background: var(--bad-soft); }
.grid td.cell.base { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 600; }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 24px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="root"></div>
<script>
addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && !r.firstChild) {
    var msg = (e && (e.message || (e.error && e.error.message))) || "A script failed to load.";
    r.innerHTML = '<div style="padding:24px;max-width:640px;margin:40px auto"><b>The forecaster could not start.</b><div style="margin-top:8px">' + msg + '</div><div style="margin-top:12px;opacity:.7">If this mentions cdnjs or unpkg, the libraries could not download. Connect to the internet and refresh.</div></div>';
  }
}, true);
</script>
<script>
/* ======================================================================
   Turo Car Forecaster
   - DEFAULTS: the example car and every input the model uses
   - forecast(): the whole money model, month by month (pure function)
   - UI below it (React + htm, no build step — edit and refresh)
   ====================================================================== */
const { useState, useEffect, useMemo, useRef } = React;
const html = htm.bind(React.createElement);

const KEY = "turo-forecaster-v1";
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const money = (n, d = 0) => (n < 0 ? "−$" : "$") + new Intl.NumberFormat("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }).format(Math.abs(isFinite(n) ? n : 0));
const short = n => { const a = Math.abs(n), s = n < 0 ? "−$" : "$"; if (a >= 1e6) return s + (a / 1e6).toFixed(1) + "M"; if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k"; return s + Math.round(a); };
const miles = n => new Intl.NumberFormat("en-US").format(Math.round(n)) + " mi";
const monthsText = m => m == null ? "Not within 10 yrs" : m < 24 ? m + " mo" : (m / 12).toFixed(1) + " yrs";
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- Inputs (the example car — change anything) ---------- */
const DEFAULTS = {
  name: "2022 Toyota Corolla LE (example)",
  // the car
  year: 2022, price: 19500, odometer: 32000, salesTaxPct: 7, titleFees: 450, prepCost: 600,
  // financing (down payment ≥ total → paid in cash, no loan)
  downPayment: 4500, apr: 7.9, termMonths: 60,
  // renting on Turo
  dailyRate: 68, bookedDays: 19, avgTripDays: 3.5, discountPct: 6, hostPlanPct: 75, extrasPerTrip: 12,
  milesPerDay: 85, personalMiles: 0,
  // running costs
  insuranceMonthly: 145, cleaningPerTrip: 20, maintPerMile: 0.08, repairReserve: 40, fuelMonthly: 20,
  parkingMonthly: 0, techMonthly: 15, registrationYearly: 250, miscMonthly: 25,
  // value, taxes, plan
  depreciationPct: 12, depPerMile: 0.05, taxPct: 15, sellCostPct: 3, horizonMonths: 36,
  maxMiles: 130000, maxAgeYears: 12,
  season: [0.8, 0.8, 0.95, 1.0, 1.05, 1.2, 1.25, 1.2, 1.0, 0.95, 0.9, 1.05],
};

/* ---------- The money model ---------- */
function forecast(car, override = {}) {
  const c = { ...car, ...override };
  const g = k => num(c[k]);
  const price = g("price"), taxRate = g("salesTaxPct") / 100;
  const vehicleCost = price * (1 + taxRate) + g("titleFees");          // car + sales tax + title/registration
  const allIn = vehicleCost + g("prepCost");                            // everything to get it Turo-ready
  const down = Math.min(Math.max(g("downPayment"), 0), vehicleCost);
  const financed = vehicleCost - down;
  const upfront = down + g("prepCost");                                 // cash out of your pocket on day one
  const r = g("apr") / 1200, term = Math.max(1, Math.round(g("termMonths")));
  const payment = financed <= 0 ? 0 : r ? financed * r / (1 - Math.pow(1 + r, -term)) : financed / term;

  const season = (c.season || DEFAULTS.season).map(num);
  const sMean = season.reduce((a, b) => a + b, 0) / 12 || 1;
  const startCal = new Date().getMonth();
  const startYear = new Date().getFullYear();
  const host = g("hostPlanPct") / 100, disc = g("discountPct") / 100, tax = g("taxPct") / 100;
  const tripDays = Math.max(g("avgTripDays"), 0.5);
  const horizon = Math.max(1, Math.round(g("horizonMonths")));
  const RUN = Math.max(horizon, 120);

  let bal = financed, cum = -upfront, opCum = 0, cumMiles = 0, prevValue = price;
  const rows = [];
  for (let m = 1; m <= RUN; m++) {
    const cal = (startCal + m - 1) % 12;
    const f = (season[cal] || 0) / sMean;
    const days = Math.min(30, Math.max(0, g("bookedDays") * f));
    const trips = days / tripDays;
    const gross = days * g("dailyRate") * (1 - disc) + trips * g("extrasPerTrip");
    const turoCut = gross * (1 - host);
    const payout = gross - turoCut;
    const mi = days * g("milesPerDay") + g("personalMiles");
    cumMiles += mi;
    const costs = {
      insurance: g("insuranceMonthly"),
      cleaning: trips * g("cleaningPerTrip"),
      maintenance: mi * g("maintPerMile"),
      repairs: g("repairReserve"),
      fuel: g("fuelMonthly"),
      parking: g("parkingMonthly"),
      tech: g("techMonthly"),
      registration: g("registrationYearly") / 12,
      misc: g("miscMonthly"),
    };
    const opCost = Object.values(costs).reduce((a, b) => a + b, 0);
    const interest = bal * r;
    const principal = bal > 0 ? Math.min(bal, payment - interest) : 0;
    const loanPay = bal > 0 ? interest + principal : 0;
    bal = Math.max(0, bal - principal);
    const value = Math.max(0, price * Math.pow(1 - g("depreciationPct") / 100, m / 12) - g("depPerMile") * cumMiles);
    const depreciation = prevValue - value; prevValue = value;
    const taxOwed = tax * Math.max(0, payout - opCost - interest - depreciation);
    const net = payout - opCost - loanPay - taxOwed;
    cum += net;
    opCum += payout - opCost - interest - taxOwed;
    const position = cum + value * (1 - g("sellCostPct") / 100) - bal;
    rows.push({
      m, label: MONTHS[cal] + " " + String(startYear + Math.floor((startCal + m - 1) / 12)).slice(2),
      days, trips, gross, turoCut, payout, costs, opCost, interest, principal, loanPay, taxOwed, net, cum, opCum,
      value, bal, position, odometer: g("odometer") + cumMiles, age: startYear + (startCal + m - 1) / 12 - g("year"),
    });
  }
  const first = fn => { const r = rows.find(fn); return r ? r.m : null; };
  const yr = rows.slice(0, 12);
  const avg = k => yr.reduce((a, r) => a + (typeof k === "function" ? k(r) : r[k]), 0) / yr.length;
  const costKeys = Object.keys(rows[0].costs);
  const avgCosts = Object.fromEntries(costKeys.map(k => [k, avg(r => r.costs[k])]));
  const end = rows[horizon - 1];
  return {
    c, allIn, vehicleCost, upfront, financed, payment, horizon, rows, view: rows.slice(0, horizon), end,
    yr1: {
      days: avg("days"), trips: avg("trips"), gross: avg("gross"), turoCut: avg("turoCut"), payout: avg("payout"),
      opCost: avg("opCost"), interest: avg("interest"), principal: avg("principal"), loanPay: avg("loanPay"),
      taxOwed: avg("taxOwed"), net: avg("net"), costs: avgCosts,
      depreciation: (price - yr[yr.length - 1].value) / yr.length,
    },
    fullPayback: first(r => r.opCum >= allIn),       // rental profit has covered the whole car
    cashPayback: first(r => r.cum >= 0),             // your out-of-pocket cash is back
    soldBreakEven: first(r => r.position >= 0),      // you'd be even if you sold the car that month
    turoLimit: first(r => r.odometer > g("maxMiles") || r.age > g("maxAgeYears")),
    annualRoi: upfront > 0 ? (end.position / upfront) / (horizon / 12) : null,
  };
}

/* Smallest value of one input that makes year-1 monthly take-home ≥ $0 */
function breakEven(car, key, lo, hi) {
  const net = v => forecast(car, { [key]: v }).yr1.net;
  if (net(hi) < 0) return null;
  if (net(lo) >= 0) return lo;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; net(mid) >= 0 ? (hi = mid) : (lo = mid); }
  return hi;
}

/* ---------- Icons ---------- */
const PATHS = {
  car: "M5 17h14M6.5 17v2M17.5 17v2M3 13l2-5.5A2 2 0 0 1 6.9 6h10.2a2 2 0 0 1 1.9 1.5L21 13v4H3zM7 13.5h.01M17 13.5h.01",
  plus: "M12 5v14M5 12h14",
  copy: "M9 9h11v11H9zM5 15H4V4h11v1",
  trash: "M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14",
  download: "M12 3v12M7 10l5 5 5-5M4 20h16",
  upload: "M12 21V9M7 14l5-5 5 5M4 4h16",
  chev: "M9 6l6 6-6 6",
  alert: "M12 3l10 18H2zM12 10v5M12 18h.01",
  check: "M5 12l5 5 9-10",
  reset: "M4 4v6h6M4.5 15a8 8 0 1 0 1.9-8.3L4 10",
};
const Icon = ({ n, s = 15 }) => html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${PATHS[n]} /></svg>`;

/* ---------- Input form definition ---------- */
const SECTIONS = [
  { title: "The car", open: true, fields: [
    ["price", "Purchase price", "$"], ["odometer", "Current miles", "", "mi"],
    ["year", "Model year", ""], ["salesTaxPct", "Sales tax", "", "%"],
    ["titleFees", "Title, registration & dealer fees", "$"], ["prepCost", "Turo prep", "$", "", "Detailing, mounts, lockbox, dashcam."],
  ]},
  { title: "Financing", open: true, fields: [
    ["downPayment", "Down payment", "$", "", "Set equal to or above the full price to model a cash purchase."],
    ["apr", "Loan APR", "", "%"], ["termMonths", "Loan term", "", "mo"],
  ]},
  { title: "Renting on Turo", open: true, fields: [
    ["dailyRate", "Daily price", "$", "/day"], ["bookedDays", "Booked days per month", "", "days", "Average across the year. 15–20 is typical for a well-priced economy car."],
    ["avgTripDays", "Average trip length", "", "days"], ["discountPct", "Average discounts", "", "%", "Weekly, monthly and early-bird discounts, blended."],
    ["hostPlanPct", "Your share (host plan)", "", "%", "Turo's protection plans pay hosts a share of the trip price. Check your plan's current %."],
    ["extrasPerTrip", "Extras per trip", "$", "", "Delivery, prepaid refuel, cooler, child seat."],
    ["milesPerDay", "Guest miles per booked day", "", "mi"], ["personalMiles", "Your own miles per month", "", "mi"],
  ]},
  { title: "Running costs", open: true, fields: [
    ["insuranceMonthly", "Your insurance", "$", "/mo", "Your own policy. Turo's plan only covers during trips."],

/* ---------- Chart: cumulative position over time ---------- */
function niceTicks(min, max, count = 5) {
  const span = max - min || 1, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= count) || 10 * mag;
  const ticks = [], top = Math.ceil(max / step - 1e-9) * step; for (let v = Math.floor(min / step) * step; v <= top + 1e-9; v += step) ticks.push(v);
  return ticks;
}
function PositionChart({ F }) {
  const [hover, setHover] = useState(null);
  const ref = useRef(null);
  const data = F.view;
  const W = 720, H = 280, L = 58, R = 20, T = 14, B = 30;
  const vals = data.flatMap(d => [d.cum, d.position]).concat([-F.upfront, 0]);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const x = i => L + (data.length === 1 ? 0 : (i / (data.length - 1)) * (W - L - R));
  const y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const path = k => data.map((d, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(d[k]).toFixed(1)).join("");
  const step = Math.max(1, Math.ceil(data.length / 9));
  const marks = [[F.cashPayback, "cash back"], [F.turoLimit, "Turo limit"]].filter(([m]) => m && m <= data.length);
  const move = e => {
    const b = ref.current.getBoundingClientRect();
    const px = ((e.clientX - b.left) / b.width) * W;
    const i = Math.round(((px - L) / (W - L - R)) * (data.length - 1));
    setHover(Math.max(0, Math.min(data.length - 1, i)));
  };
  const h = hover != null ? data[hover] : null;
  const last = data[data.length - 1];
  return html`<div>
    <div class="legend"><span><i style=${{ background: "var(--s1)" }}></i>Cash in hand (after paying for everything)</span><span><i style=${{ background: "var(--s2)" }}></i>If you sold the car that month</span></div>
    <div class="chartbox">
      <svg ref=${ref} viewBox=${`0 0 ${W} ${H}`} onMouseMove=${move} onMouseLeave=${() => setHover(null)} role="img" aria-label="Cumulative cash and sell-today position by month">
        ${ticks.map(t => html`<g key=${t}><line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} stroke=${t === 0 ? "var(--muted)" : "var(--grid)"} stroke-width="1" /><text x=${L - 8} y=${y(t) + 4} text-anchor="end" font-size="11" fill="var(--sub)" class="num">${short(t)}</text></g>`)}
        ${data.map((d, i) => i % step === 0 || i === data.length - 1 ? html`<text key=${i} x=${x(i)} y=${H - 10} text-anchor="middle" font-size="11" fill="var(--sub)">${d.label}</text>` : null)}
        ${marks.map(([m, t]) => html`<g key=${t}><line x1=${x(m - 1)} x2=${x(m - 1)} y1=${T} y2=${H - B} stroke="var(--muted)" stroke-dasharray="3 3" /><text x=${x(m - 1) + 4} y=${T + 10} font-size="11" fill="var(--sub)">${t}</text></g>`)}
        <path d=${path("position")} fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" />
        <path d=${path("cum")} fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" />
        <circle cx=${x(data.length - 1)} cy=${y(last.cum)} r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2" />
        <circle cx=${x(data.length - 1)} cy=${y(last.position)} r="4" fill="var(--s2)" stroke="var(--card)" stroke-width="2" />
        ${h && html`<g><line x1=${x(hover)} x2=${x(hover)} y1=${T} y2=${H - B} stroke="var(--sub)" stroke-width="1" />
          <circle cx=${x(hover)} cy=${y(h.cum)} r="5" fill="var(--s1)" stroke="var(--card)" stroke-width="2" />
          <circle cx=${x(hover)} cy=${y(h.position)} r="5" fill="var(--s2)" stroke="var(--card)" stroke-width="2" /></g>`}
        <rect x=${L} y=${T} width=${W - L - R} height=${H - T - B} fill="transparent" />
      </svg>
      ${h && html`<div class="tip" style=${{ left: `min(calc(${(x(hover) / W) * 100}% + 12px), calc(100% - 190px))`, top: "8px" }}>
        <b>Month ${h.m} · ${h.label}</b>
        <div><span>Cash in hand</span><span class="num">${money(h.cum)}</span></div>
        <div><span>If sold</span><span class="num">${money(h.position)}</span></div>
        <div><span>Take-home this month</span><span class="num">${money(h.net)}</span></div>
        <div><span>Odometer</span><span class="num">${miles(h.odometer)}</span></div>
      </div>`}
    </div>
  </div>`;
}

          <div class="li"><span class="k">Car loses value (not cash)</span><span class="num">−${money(y.depreciation)}</span></div>
        </div>
      </div>

        <h2>Where each month's bookings go</h2>

/* ---------- App shell: storage, cars, tabs ---------- */
const newCar = (over = {}) => ({ ...DEFAULTS, season: [...DEFAULTS.season], id: uid(), ...over });
function App() {
  const [cars, setCars] = useState([]);
  const [activeId, setActiveId] = useState(null);
  const [tab, setTab] = useState("summary");
  const [loaded, setLoaded] = useState(false);
  const [serverMode, setServerMode] = useState(false);
  const [status, setStatus] = useState("…");
  const [confirmDel, setConfirmDel] = useState(false);

  const apply = d => {
    const list = (d && d.cars && d.cars.length ? d.cars : [newCar()]).map(c => ({ ...DEFAULTS, ...c, id: c.id || uid() }));
    setCars(list);
    setActiveId(list.some(c => c.id === d?.activeId) ? d.activeId : list[0].id);
  };
  useEffect(() => { (async () => {
    try { const r = await fetch("/api/data", { cache: "no-store" }); if (r.ok) { apply(await r.json()); setServerMode(true); setStatus("Saved to file"); setLoaded(true); return; } } catch (e) {}
    try { const raw = localStorage.getItem(KEY); apply(raw ? JSON.parse(raw) : null); } catch (e) { apply(null); }
    setStatus("Saved in this browser"); setLoaded(true);
  })(); }, []);
  useEffect(() => {
    if (!loaded) return;
    const payload = JSON.stringify({ cars, activeId });
    const t = setTimeout(async () => {
      try { localStorage.setItem(KEY, payload); } catch (e) {}
      if (serverMode) {
        try { setStatus("Saving…"); const r = await fetch("/api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload }); setStatus(r.ok ? "Saved to file" : "Save failed — browser copy kept"); }
        catch (e) { setStatus("Save failed — browser copy kept"); }
      }
    }, 400);
    return () => clearTimeout(t);
  }, [cars, activeId, loaded, serverMode]);

  const car = cars.find(c => c.id === activeId) || cars[0];
  const F = useMemo(() => car ? forecast(car) : null, [car]);
  const update = (k, v) => setCars(a => a.map(c => c.id === car.id ? { ...c, [k]: v } : c));
  const updateSeason = (i, v) => setCars(a => a.map(c => { if (c.id !== car.id) return c; const s = [...(c.season || DEFAULTS.season)]; s[i] = v; return { ...c, season: s }; }));
  const addCar = () => { const c = newCar({ name: "New car " + (cars.length + 1) }); setCars(a => [...a, c]); setActiveId(c.id); setConfirmDel(false); };
  const dupCar = () => { const c = { ...car, season: [...(car.season || DEFAULTS.season)], id: uid(), name: car.name + " (copy)" }; setCars(a => [...a, c]); setActiveId(c.id); setConfirmDel(false); };
  const delCar = () => { const rest = cars.filter(c => c.id !== car.id); const list = rest.length ? rest : [newCar()]; setCars(list); setActiveId(list[0].id); setConfirmDel(false); };
  const resetCar = () => setCars(a => a.map(c => c.id === car.id ? newCar({ id: c.id, name: c.name }) : c));

  const save = (name, text, type) => { const url = URL.createObjectURL(new Blob([text], { type })); const a = document.createElement("a"); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  const backup = () => save("turo-forecaster-backup-" + today() + ".json", JSON.stringify({ cars, activeId }, null, 2), "application/json");
  const restore = file => { if (!file) return; const r = new FileReader(); r.onload = e => { try { apply(JSON.parse(e.target.result)); setStatus("Backup restored"); } catch (err) { setStatus("That file isn't a valid backup"); } }; r.readAsText(file); };
  const exportCsv = () => {
    const head = "Month,Label,Booked days,Trips,Guests pay,Turo share,Payout,Running costs,Loan payment,Interest,Tax,Take-home,Cash in hand,Car value,Loan balance,If sold,Odometer";
    const body = F.view.map(r => [r.m, r.label, r.days, r.trips, r.gross, r.turoCut, r.payout, r.opCost, r.loanPay, r.interest, r.taxOwed, r.net, r.cum, r.value, r.bal, r.position, r.odometer].map(v => typeof v === "number" ? v.toFixed(2) : v).join(",")).join("\n");
    save((car.name || "car").replace(/[^a-z0-9]+/gi, "-") + "-forecast.csv", head + "\n" + body + "\n", "text/csv");
  };

  if (!loaded || !car) return html`<div class="wrap" style=${{ paddingBlock: "40px", color: "var(--sub)" }}>Loading…</div>`;
  const y = F.yr1;
  return html`<div>
    <header class="top"><div class="wrap">
      <div class="brand"><div class="badge"><${Icon} n="car" s=${22} /></div><div><h1>Turo Car Forecaster</h1><div class="status">${status}</div></div></div>
      <div class="actions">
        <button class="btn primary" onClick=${addCar}><${Icon} n="plus" s=${13} /> New car</button>
        <button class="btn" onClick=${dupCar}><${Icon} n="copy" s=${13} /> Duplicate</button>
        <button class="btn" onClick=${exportCsv}><${Icon} n="download" s=${13} /> Export CSV</button>
        <button class="btn" onClick=${backup}><${Icon} n="download" s=${13} /> Backup</button>
        <label class="btn" for="restore"><${Icon} n="upload" s=${13} /> Restore</label>
        <input id="restore" type="file" accept=".json" hidden onChange=${e => { restore(e.target.files[0]); e.target.value = ""; }} />
      </div>
    </div></header>
    <div class="wrap">
      <div class="cars" role="tablist" aria-label="Cars">
        ${cars.map(c => html`<button key=${c.id} class=${"chip" + (c.id === car.id ? " on" : "")} onClick=${() => { setActiveId(c.id); setConfirmDel(false); }}>${c.name || "Untitled car"}</button>`)}
      </div>
      <div class="main">
        <div style=${{ display: "flex", flexDirection: "column", gap: "8px", minWidth: 0 }}>
          <${Inputs} car=${car} onChange=${update} onSeason=${updateSeason} />
          <div style=${{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
            <button class="btn" onClick=${resetCar}><${Icon} n="reset" s=${13} /> Reset to example numbers</button>
            ${confirmDel
              ? html`<span class="confirm">Delete this car? <button class="btn" onClick=${delCar}>Delete</button><button class="btn" onClick=${() => setConfirmDel(false)}>Keep</button></span>`
              : html`<button class="btn" onClick=${() => setConfirmDel(true)}><${Icon} n="trash" s=${13} /> Delete car</button>`}
          </div>
        </div>
        <section class="results" aria-label="Forecast">
          <div class="kpis">
            <div class="panel kpi hero"><div class="lbl">Pays for itself in</div><div class="val">${monthsText(F.fullPayback)}</div><div class="sub">Rental profit covers the full ${money(F.allIn)} all-in cost</div></div>
            <div class="panel kpi"><div class="lbl">Monthly take-home</div><div class=${"val num " + (y.net >= 0 ? "good" : "bad")} style=${{ fontFamily: "var(--f-display)" }}>${money(y.net)}</div><div class="sub">year-one average, after loan & tax</div></div>
            <div class="panel kpi"><div class="lbl">Your cash back in</div><div class="val">${monthsText(F.cashPayback)}</div><div class="sub">recovers ${money(F.upfront)} you put in</div></div>
            <div class="panel kpi"><div class="lbl">After ${F.horizon} months</div><div class=${"val " + (F.end.position >= 0 ? "good" : "bad")}>${short(F.end.position)}</div><div class="sub">ahead if you sell then${F.annualRoi != null ? ` · ${Math.round(F.annualRoi * 100)}%/yr on your cash` : ""}</div></div>
          </div>
          <div class="tabs" role="tablist">
            ${[["summary", "Summary"], ["monthly", "Month by month"], ["whatif", "What-if"], ["compare", "Compare cars"]].map(([id, l]) => html`<button key=${id} role="tab" aria-selected=${tab === id} class=${"tab" + (tab === id ? " on" : "")} onClick=${() => setTab(id)}>${l}</button>`)}
          </div>
          ${tab === "summary" && html`<${Summary} F=${F} />`}
          ${tab === "monthly" && html`<${Monthly} F=${F} />`}
          ${tab === "whatif" && html`<${WhatIf} car=${car} />`}
          ${tab === "compare" && html`<${Compare} cars=${cars} activeId=${car.id} onPick=${id => { setActiveId(id); setTab("summary"); }} />`}
        </section>
      </div>
      <div class="foot">${serverMode ? "Your cars are saved to a file on this computer (Documents/Turo-Forecaster). Use Backup now and then." : "Running without the local server, so cars are saved in this browser only. Use Backup to keep a copy."} Estimates only — check Turo's current host plans, fees and eligibility rules.</div>
    </div>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
