<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monthly Expenses</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#F6F7F4; }
  .serif { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; letter-spacing: .2px; }
  input::placeholder { color: #A9B0AC; }
  .fld { width:100%; background:transparent; outline:none; font-size:13px; border:1px solid #E3E6E0; border-radius:8px; padding:0 9px; height:34px; color:#22303C; }
  .fld:focus { border-color:#3F6E8C; }
  .bar-hit { cursor:pointer; }
  .bar-hit:hover rect { opacity:.85; }
</style>
</head>
<body>
<div id="root"></div>
<script>
addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && !r.firstChild) {
    var msg = (e && (e.message || (e.error && e.error.message))) || "A script failed to load.";
    r.innerHTML = '<div style="font-family:ui-sans-serif,system-ui;padding:24px;max-width:640px;margin:40px auto;color:#22303C"><div style="font-weight:600;color:#9B2C2C;margin-bottom:8px">The app could not start.</div><div style="font-size:14px;line-height:1.5">' + msg + '</div><div style="font-size:13px;color:#7C8580;margin-top:12px">If this mentions unpkg or cdnjs, it is an internet / first-load issue — connect and refresh. Otherwise send this text to Claude.</div></div>';
  }
}, true);
</script>

<script>
const { useState, useEffect, useMemo } = React;
const h = React.createElement;

const C = {
  ink: "#22303C",
  paper: "#F6F7F4",
  card: "#FFFFFF",
  line: "#E3E6E0",
  sub: "#7C8580",
  accent: "#3F6E8C",
  good: "#2E7D6B",
  bad: "#C0563F",
  danger: "#9B2C2C",
  soft: "#EAF0F3",
  india: "#D9731E",
  indiaSoft: "#FBEFE3"
};

/* Spending categories. "fixed" ones are copied forward each month with one click.
   "india" is money sent home: tracked on its own, never counted as household spending. */
const CATS = [
  { id: "rent", label: "Rent", icon: "home", color: "#3F6E8C", fixed: true },
  { id: "gas", label: "Gas", icon: "flame", color: "#D08C3C", fixed: true },
  { id: "electricity", label: "Electricity", icon: "bolt", color: "#C9A227", fixed: true },
  { id: "internet", label: "Internet / WiFi", icon: "wifi", color: "#6C63B5", fixed: true },
  { id: "phone", label: "Phone bill", icon: "phone", color: "#2F8F9D", fixed: true },
  { id: "fuel", label: "Fuel", icon: "fuel", color: "#8A6A4F", fixed: true },
  { id: "groceries", label: "Groceries", icon: "cart", color: "#4E9A6B" },
  { id: "subscriptions", label: "Subscriptions", hint: "Netflix, Prime…", icon: "tv", color: "#C2577A" },
  { id: "other", label: "Other", icon: "dots", color: "#8C949A" }
];
const INDIA = { id: "india", label: "Transfer to India", icon: "send", color: C.india };
const ALL_CATS = [...CATS, INDIA];
const CAT = Object.fromEntries(ALL_CATS.map(c => [c.id, c]));
const FIXED = CATS.filter(c => c.fixed);
const isFixed = id => !!(CAT[id] && CAT[id].fixed);

/* icons: [tag, attrs] lists, drawn as 24×24 strokes */
const I = {
  home: [["path", { d: "M3 10.5 12 3l9 7.5" }], ["path", { d: "M5 9.5V21h14V9.5" }], ["path", { d: "M10 21v-6h4v6" }]],
  flame: [["path", { d: "M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z" }]],
  bolt: [["path", { d: "M13 2 3 14h9l-1 8 10-12h-9l1-8z" }]],
  cart: [["circle", { cx: "9", cy: "21", r: "1" }], ["circle", { cx: "20", cy: "21", r: "1" }], ["path", { d: "M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6" }]],
  wifi: [["path", { d: "M5 12.55a11 11 0 0 1 14.08 0" }], ["path", { d: "M1.42 9a16 16 0 0 1 21.16 0" }], ["path", { d: "M8.53 16.11a6 6 0 0 1 6.95 0" }], ["line", { x1: "12", y1: "20", x2: "12.01", y2: "20" }]],
  phone: [["rect", { x: "5", y: "2", width: "14", height: "20", rx: "2" }], ["line", { x1: "12", y1: "18", x2: "12.01", y2: "18" }]],
  tv: [["rect", { x: "2", y: "7", width: "20", height: "15", rx: "2" }], ["polyline", { points: "17 2 12 7 7 2" }]],
  fuel: [["path", { d: "M3 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18" }], ["path", { d: "M2 22h14" }], ["path", { d: "M3 10h12" }], ["path", { d: "M15 8h2a2 2 0 0 1 2 2v7a1.5 1.5 0 0 0 3 0V9l-3-3" }]],
  dots: [["circle", { cx: "5", cy: "12", r: "1" }], ["circle", { cx: "12", cy: "12", r: "1" }], ["circle", { cx: "19", cy: "12", r: "1" }]],
  send: [["path", { d: "M22 2 11 13" }], ["path", { d: "M22 2 15 22 11 13 2 9 22 2z" }]],
  plus: [["line", { x1: "12", y1: "5", x2: "12", y2: "19" }], ["line", { x1: "5", y1: "12", x2: "19", y2: "12" }]],
  trash: [["polyline", { points: "3 6 5 6 21 6" }], ["path", { d: "M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" }]],
  upload: [["path", { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }], ["polyline", { points: "17 8 12 3 7 8" }], ["line", { x1: "12", y1: "3", x2: "12", y2: "15" }]],
  download: [["path", { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }], ["polyline", { points: "7 10 12 15 17 10" }], ["line", { x1: "12", y1: "15", x2: "12", y2: "3" }]],
  refresh: [["path", { d: "M21 12a9 9 0 1 1-3-6.7L21 8" }], ["polyline", { points: "21 3 21 8 16 8" }]],
  copy: [["rect", { x: "9", y: "9", width: "13", height: "13", rx: "2" }], ["path", { d: "M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" }]],
  left: [["polyline", { points: "15 18 9 12 15 6" }]],
  right: [["polyline", { points: "9 18 15 12 9 6" }]],
  wallet: [["path", { d: "M21 12V7H5a2 2 0 0 1 0-4h14v4" }], ["path", { d: "M3 5v14a2 2 0 0 0 2 2h16v-5" }], ["path", { d: "M18 12a2 2 0 0 0 0 4h4v-4Z" }]],
  target: [["circle", { cx: "12", cy: "12", r: "9" }], ["circle", { cx: "12", cy: "12", r: "5" }], ["circle", { cx: "12", cy: "12", r: "1" }]],
  up: [["polyline", { points: "3 17 9 11 13 15 21 7" }], ["polyline", { points: "15 7 21 7 21 13" }]],
  down: [["polyline", { points: "3 7 9 13 13 9 21 17" }], ["polyline", { points: "15 17 21 17 21 11" }]],
  calendar: [["rect", { x: "3", y: "4", width: "18", height: "18", rx: "2" }], ["line", { x1: "16", y1: "2", x2: "16", y2: "6" }], ["line", { x1: "8", y1: "2", x2: "8", y2: "6" }], ["line", { x1: "3", y1: "10", x2: "21", y2: "10" }]]
};
function Icon({ name, size = 16, color = "currentColor", className, style }) {
  return h("svg", {
    xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: color, strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round",
    className, style
  }, (I[name] || []).map(([tag, attrs], i) => h(tag, { key: i, ...attrs })));
}

/* ---------- helpers ---------- */
const KEY = "monthly-expenses-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => {
  const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : 0;
};
const money = (n, d = 2) => (n < 0 ? "−" : "") + new Intl.NumberFormat("en-US", {
  minimumFractionDigits: d,
  maximumFractionDigits: d
}).format(Math.abs(isFinite(n) ? n : 0));
const short = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "k";
  return String(Math.round(n));
};
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const thisMonth = () => today().slice(0, 7);
const shiftMonth = (m, k) => {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + k, 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1);
};
const daysIn = m => {
  const [y, mo] = m.split("-").map(Number);
  return new Date(y, mo, 0).getDate();
};
const monthLabel = (m, style = "long") => {
  if (!m) return "—";
  const [y, mo] = String(m).split("-");
  const d = new Date(Number(y), Number(mo) - 1, 1);
  if (isNaN(d)) return m;
  if (style === "tiny") return d.toLocaleString("en-US", { month: "short" });
  return d.toLocaleString("en-US", { month: style === "long" ? "long" : "short", year: "numeric" });
};
const normDate = v => {
  if (v === "" || v == null) return "";
  if (typeof v === "number") {
    const dt = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (!isNaN(dt)) return dt.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const dt = new Date(s);
  return isNaN(dt) ? s : ymd(dt);
};
const pick = (row, keys) => {
  const low = {};
  Object.keys(row).forEach(k => low[k.toLowerCase().replace(/[^a-z]/g, "")] = row[k]);
  for (const k of keys) if (low[k] !== undefined && low[k] !== "") return low[k];
  return "";
};
/* Map free text ("Netflix", "petrol", "Airtel") to a category id. Fuel is checked before gas so "gasoline" lands in fuel. */
const CAT_WORDS = [
  ["india", ["india", "remit", "transfer", "remitly", "western union", "sent to", "send to", "sent home", "family", "mum", "mom", "dad", "parents", "nre", "nro"]],
  ["fuel", ["fuel", "petrol", "diesel", "gasoline", "cng"]],
  ["subscriptions", ["subscription", "subs", "netflix", "prime", "spotify", "disney", "hulu", "hotstar", "youtube", "apple tv", "hbo"]],
  ["phone", ["phone", "mobile", "airtel", "jio", "vodafone", "etisalat", "verizon", "t-mobile", "sim"]],
  ["internet", ["internet", "wifi", "wi-fi", "broadband", "fibre", "fiber"]],
  ["electricity", ["electricity", "electric", "power", "energy"]],
  ["gas", ["gas", "heating", "lpg", "cylinder"]],
  ["groceries", ["grocery", "groceries", "grocer", "supermarket", "food", "vegetables"]],
  ["rent", ["rent", "mortgage", "lease"]]
];
const guessCat = text => {
  const t = String(text || "").toLowerCase().trim();
  if (!t) return "other";
  for (const c of ALL_CATS) if (t === c.id || t === c.label.toLowerCase()) return c.id;
  for (const [id, words] of CAT_WORDS) if (words.some(w => t.includes(w))) return id;
  return "other";
};
const dl = (name, text, type = "text/csv") => {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
};
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
const sameItem = e => e.category + "|" + String(e.note || "").trim().toLowerCase();

/* =================================================================== */
function App() {
  const [tab, setTab] = useState("overview");
  const [month, setMonth] = useState(thisMonth());
  const [expenses, setExpenses] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [serverMode, setServerMode] = useState(false);
  const [status, setStatus] = useState("…");

  const applyData = d => {
    setExpenses((d.expenses || []).map(e => ({
      id: e.id || uid(),
      date: e.date || "",
      category: CAT[e.category] ? e.category : guessCat(e.category || e.note),
      note: e.note ?? "",
      amount: e.amount ?? ""
    })));
  };
  useEffect(() => {
    (async () => {
      try {
        const r = await fetch("api/data", { cache: "no-store" });
        if (r.ok) {
          applyData(await r.json());
          setServerMode(true);
          setStatus("Saved to file");
          setLoaded(true);
          return;
        }
      } catch (e) {}
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) applyData(JSON.parse(raw));
      } catch (e) {}
      setStatus("Saved in this browser");
      setLoaded(true);
    })();
  }, []);
  useEffect(() => {
    if (!loaded) return;
    const payload = JSON.stringify({ expenses });
    const t = setTimeout(async () => {
      try { localStorage.setItem(KEY, payload); } catch (e) {}
      if (serverMode) {
        try {
          setStatus("Saving…");
          const r = await fetch("api/data", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload });
          setStatus(r.ok ? "Saved to file" : "Save failed — browser copy kept");
        } catch (e) {
          setStatus("Save failed — browser copy kept");
        }
      }
    }, 500);
    return () => clearTimeout(t);
  }, [expenses, loaded, serverMode]);
  const reload = async () => {
    if (serverMode) {
      try {
        const r = await fetch("api/data", { cache: "no-store" });
        if (r.ok) { applyData(await r.json()); setStatus("Reloaded from file"); return; }
      } catch (e) {}
    }
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { applyData(JSON.parse(raw)); setStatus("Reloaded"); }
    } catch (e) {}
  };

  /* ---- edits ---- */
  const addExpense = e => setExpenses(a => [{ id: uid(), ...e }, ...a]);
  const updateExpense = (id, f, v) => setExpenses(a => a.map(x => x.id === id ? { ...x, [f]: v } : x));
  const removeExpense = id => setExpenses(a => a.filter(x => x.id !== id));

  /* ---- totals per month: household spending (fixed + other) kept apart from India transfers ---- */
  const byMonth = useMemo(() => {
    const map = {};
    expenses.forEach(e => {
      const m = (e.date || "").slice(0, 7);
      if (!m) return;
      if (!map[m]) map[m] = { total: 0, fixed: 0, india: 0, count: 0, cats: {} };
      const a = num(e.amount);
      if (e.category === "india") {
        map[m].india += a;
      } else {
        map[m].total += a;
        map[m].count++;
        if (isFixed(e.category)) map[m].fixed += a;
        map[m].cats[e.category] = (map[m].cats[e.category] || 0) + a;
      }
    });
    return map;
  }, [expenses]);
  const empty = { total: 0, fixed: 0, india: 0, count: 0, cats: {} };
  const cur = byMonth[month] || empty;
  const prev = byMonth[shiftMonth(month, -1)] || empty;
  const monthExpenses = useMemo(() => expenses
    .filter(e => (e.date || "").slice(0, 7) === month)
    .sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0), [expenses, month]);
  const indiaYear = useMemo(() => expenses
    .filter(e => e.category === "india" && (e.date || "").slice(0, 4) === month.slice(0, 4) && (e.date || "").slice(0, 7) <= month)
    .reduce((s, e) => s + num(e.amount), 0), [expenses, month]);

  /* Fixed bills (rent, gas, electricity, WiFi, phone, fuel): copy the most recent earlier month's entries
     into this month, same day and amount, skipping any already here. Amounts can be edited afterwards. */
  const copyPlan = useMemo(() => {
    for (let k = 1; k <= 12; k++) {
      const src = shiftMonth(month, -k);
      const items = expenses.filter(e => isFixed(e.category) && (e.date || "").slice(0, 7) === src);
      if (!items.length) continue;
      const have = new Set(monthExpenses.map(sameItem));
      return { src, items: items.filter(e => !have.has(sameItem(e))) };
    }
    return { src: null, items: [] };
  }, [expenses, monthExpenses, month]);
  const copyFixed = () => {
    const last = daysIn(month);
    setExpenses(a => [...copyPlan.items.map(e => ({
      id: uid(),
      date: month + "-" + pad(Math.min(last, Number((e.date || "").slice(8, 10)) || 1)),
      category: e.category,
      note: e.note,
      amount: e.amount
    })), ...a]);
  };

  /* ---- import / export ---- */
  const readSheet = (file, cb) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" }));
      } catch (err) {
        alert("Could not read that file. Use a CSV or Excel file in the template format.");
      }
    };
    reader.readAsArrayBuffer(file);
  };
  const uploadExpenses = file => readSheet(file, rows => {
    const mapped = rows.map(r => {
      const note = String(pick(r, ["description", "note", "notes", "item", "name", "details", "payee"]) || "");
      const rawCat = pick(r, ["category", "type", "cat"]);
      return {
        id: uid(),
        date: normDate(pick(r, ["date", "paid", "paidon", "day"])),
        category: guessCat(rawCat) !== "other" ? guessCat(rawCat) : guessCat(note),
        note,
        amount: num(pick(r, ["amount", "cost", "price", "total", "spent", "paid"]))
      };
    }).filter(x => x.amount || x.note);
    if (!mapped.length) return alert("No rows found. Check the template columns.");
    setExpenses(a => [...mapped, ...a]);
    alert("Imported " + mapped.length + " entr" + (mapped.length === 1 ? "y" : "ies") + ".");
  });
  const template = () => dl("expenses-template.csv",
    "Date,Category,Description,Amount\n" +
    "2026-10-01,Rent,Flat rent,1200\n" +
    "2026-10-03,Internet / WiFi,Home broadband,45\n" +
    "2026-10-04,Phone bill,Mobile plan,30\n" +
    "2026-10-05,Subscriptions,Netflix,15.49\n" +
    "2026-10-06,Groceries,Weekly shop,86.40\n" +
    "2026-10-08,Fuel,Petrol,52\n" +
    "2026-10-12,Electricity,Electric bill,74.10\n" +
    "2026-10-12,Gas,Gas bill,38.75\n" +
    "2026-10-15,Transfer to India,Sent to family,500\n");
  const exportMonth = () => dl("expenses-" + month + ".csv",
    "Date,Category,Description,Amount\n" +
    monthExpenses.slice().reverse().map(e => [e.date, CAT[e.category]?.label || "Other", e.note, num(e.amount).toFixed(2)].map(csvCell).join(",")).join("\n") + "\n");
  const exportData = () => dl("expenses-backup-" + today() + ".json", JSON.stringify({ expenses }, null, 2), "application/json");
  const importData = file => {
    if (!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        if (!Array.isArray(d.expenses)) throw new Error();
        applyData(d);
        alert("Backup restored.");
      } catch (err) {
        alert("That file isn't a valid backup.");
      }
    };
    r.readAsText(file);
  };

  if (!loaded) return h("div", { style: { background: C.paper, minHeight: "100vh", color: C.sub }, className: "flex items-center justify-center text-sm" }, "Loading…");

  const delta = cur.total - prev.total;
  const hdrBtn = { color: C.sub, border: `1px solid ${C.line}`, background: C.card };
  return h("div", { style: { background: C.paper, color: C.ink, minHeight: "100vh" }, className: "w-full" },
    /* header */
    h("div", { style: { background: C.paper, borderBottom: `1px solid ${C.line}` }, className: "px-4 sm:px-6 py-4" },
      h("div", { className: "max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3" },
        h("div", { className: "flex items-center gap-3" },
          h("div", { style: { background: C.soft, border: `1px solid ${C.line}` }, className: "h-10 w-10 rounded-full flex items-center justify-center" },
            h(Icon, { name: "wallet", size: 19, color: C.accent })),
          h("div", null,
            h("div", { className: "serif text-2xl leading-none" }, "Monthly Expenses"),
            h("div", { style: { color: C.sub }, className: "text-xs mt-1" }, "Household spending · ", status))),
        h("div", { className: "flex items-center gap-2" },
          h("button", { onClick: reload, style: hdrBtn, className: "text-xs px-2.5 py-1.5 rounded-full inline-flex items-center gap-1" },
            h(Icon, { name: "refresh", size: 13, color: C.sub }), " Reload"),

      return h("div", { style: { padding: 24, maxWidth: 640, margin: "40px auto", color: C.ink, fontFamily: "ui-sans-serif, system-ui" } },
        h("div", { style: { fontWeight: 600, color: C.danger, marginBottom: 8 } }, "The app hit an error."),
        h("pre", { style: { whiteSpace: "pre-wrap", fontSize: 13 } }, String(this.state.e && this.state.e.message || this.state.e)));
    }
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(h(ErrBoundary, null, h(App)));
</script>
